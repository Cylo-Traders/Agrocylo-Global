name: Deploy

# Builds Docker images for all four apps, pushes to ghcr.io, and deploys
# to Fly.io.  Staging deploys on every merge to main; production deploys
# when a version tag (v*) is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging or production)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "22"

jobs:
  # ── Check that CI passed (Issue #910) ───────────────────────────────────────
  # Ensures we never deploy when CI is failing. The CI workflow must pass
  # before any deployment steps run.
  ci-gate:
    name: CI gate check
    # Issue #1301: Enforce on push, tags, and workflow_dispatch so red CI blocks deployment
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required CI status on target commit (Issue #1301)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Checking required CI check-runs for commit ${TARGET_SHA}..."
          
          # Query GitHub API check-runs for the target commit SHA
          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" --paginate)
          
          # Log evaluated commit SHA without leaking any tokens
          echo "Verifying check-runs for commit SHA: ${TARGET_SHA}"

          # Extract conclusions of completed runs and active runs
          node -e '
            const checks = JSON.parse(process.argv[1]);
            const runs = checks.check_runs || [];
            console.log(`Found ${runs.length} check runs for commit ${process.env.TARGET_SHA}`);
            
            const failures = [];
            const inProgress = [];
            
            for (const run of runs) {
              // Ignore this deploy workflow run itself
              if (run.name.includes("deploy") || run.name.includes("Deploy") || run.name.includes("CI gate check")) {
                continue;
              }
              
              if (run.status !== "completed") {
                inProgress.push(`${run.name} (status: ${run.status})`);
              } else if (["failure", "cancelled", "timed_out", "action_required"].includes(run.conclusion)) {
                failures.push(`${run.name} (conclusion: ${run.conclusion})`);
              } else {
                console.log(`PASS: ${run.name} [${run.conclusion}]`);
              }
            }

            if (failures.length > 0) {
              console.error("ERROR: Required CI check-runs failed on target commit:");
              for (const f of failures) console.error("  - " + f);
              process.exit(1);
            }

            if (inProgress.length > 0) {
              console.error("ERROR: Required CI check-runs still in progress on target commit:");
              for (const p of inProgress) console.error("  - " + p);
              process.exit(1);
            }

            console.log("SUCCESS: All required CI check-runs are green.");
          ' "$CHECKS_JSON"

  # ── Determine target environment ────────────────────────────────────────────
  resolve-env:
    name: Resolve environment
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Determine environment
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy & cross-wire Soroban contracts (testnet / staging) ──────────────
  deploy-contracts:
    name: Deploy contracts · testnet
    needs: resolve-env
    if: needs.resolve-env.outputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies for stellar-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Rust 1.89.0 + wasm target
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.89.0
          rustup override set 1.89.0

      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version '^22'

      - name: Configure deployer identity
        run: stellar keys add ci-deployer --secret-key <<< "${{ secrets.TESTNET_DEPLOYER_SECRET }}"

      - name: Deploy + wire + verify
        env:
          DEPLOYER: ci-deployer
          ADMIN: ${{ vars.TESTNET_CONTRACT_ADMIN }}
          FEE_COLLECTOR: ${{ vars.TESTNET_FEE_COLLECTOR }}
          SUPPORTED_TOKENS: ${{ vars.TESTNET_SUPPORTED_TOKENS }}
          FEE_RATE_BPS: ${{ vars.TESTNET_FEE_RATE_BPS }}
          PATH_PAYMENT_ROUTER: ${{ vars.TESTNET_PATH_PAYMENT_ROUTER }}
        run: scripts/deploy-contracts.sh --network testnet

      - name: Upload address manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployed-addresses-testnet
          path: deployments/deployed-addresses.testnet.json

  # ── Build & push Docker images ──────────────────────────────────────────────
  build-images:
    environment: ${{ needs.resolve-env.outputs.environment }}
    name: Build · ${{ matrix.app }}
    needs: resolve-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            context: ./server
            file: ./server/Dockerfile
            image: agrocylo-server
            port: "5000"
          - app: client
            context: .
            file: ./client/Dockerfile
            image: agrocylo-client
            port: "3000"
          - app: agro-server
            context: ./agro-production/server
            file: ./agro-production/server/Dockerfile
            image: agrocylo-agro-server
            port: "5001"
          - app: agro-client
            context: .
            file: ./agro-production/client/Dockerfile
            image: agrocylo-agro-client
            port: "3001"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SOROBAN_RPC_URL=${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
            NEXT_PUBLIC_HORIZON_URL=${{ vars.NEXT_PUBLIC_HORIZON_URL }}
            NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_STELLAR_ENV=${{ vars.NEXT_PUBLIC_STELLAR_ENV }}
            NEXT_PUBLIC_API_URL=${{ vars.AGRO_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.AGRO_NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_PRODUCTION_CONTRACT_ID=${{ vars.NEXT_PUBLIC_PRODUCTION_CONTRACT_ID }}
            NEXT_PUBLIC_AGRO_PRODUCTION_ENABLED=${{ vars.NEXT_PUBLIC_AGRO_PRODUCTION_ENABLED }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Fly.io ───────────────────────────────────────────────────────
  deploy:
    name: Deploy · ${{ needs.resolve-env.outputs.environment }}
    # Migration is a release gate: no Fly machine is updated until both
    # databases have accepted the committed migration history.
    needs: [resolve-env, migrate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-env.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      FLY_APP_ROOT: agrocylo-marketplace
      FLY_APP_AGRO: agrocylo-production
      FLY_APP_ROOT_CLIENT: agrocylo-client
      FLY_APP_AGRO_CLIENT: agrocylo-agro-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly app names per environment
        id: apps
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "app_root=agrocylo-marketplace"           >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production"             >> "$GITHUB_OUTPUT"
            echo "app_root_client=agrocylo-client"          >> "$GITHUB_OUTPUT"
            echo "app_agro_client=agrocylo-agro-client"     >> "$GITHUB_OUTPUT"
          else
            echo "app_root=agrocylo-marketplace-staging"    >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production-staging"     >> "$GITHUB_OUTPUT"
            echo "app_root_client=agrocylo-client-staging"  >> "$GITHUB_OUTPUT"
            echo "app_agro_client=agrocylo-agro-client-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy root server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "${{ steps.apps.outputs.app_root }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/agrocylo-server:latest" \
            --strategy immediate

      - name: Deploy root client
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "${{ steps.apps.outputs.app_root_client }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/agrocylo-client:latest" \
            --strategy immediate

      - name: Deploy agro-production server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "${{ steps.apps.outputs.app_agro }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/agrocylo-agro-server:latest" \
            --strategy immediate

      - name: Deploy agro-production client
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "${{ steps.apps.outputs.app_agro_client }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/agrocylo-agro-client:latest" \
            --strategy immediate

      - name: Output URL
        id: deploy
        run: echo "url=https://${{ steps.apps.outputs.app_root }}.fly.dev" >> "$GITHUB_OUTPUT"

  # ── Run migrations ─────────────────────────────────────────────────────────
  migrate:
    name: Run migrations
    # Build the exact release images first, then migrate, then promote those
    # images in the deploy job below. The application never starts before its
    # schema is ready, and a failed migration blocks rollout.
    needs: [resolve-env, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set app names
        id: apps
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "app_root=agrocylo-marketplace"        >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production"          >> "$GITHUB_OUTPUT"
          else
            echo "app_root=agrocylo-marketplace-staging" >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production-staging"  >> "$GITHUB_OUTPUT"
          fi

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install agro-server dependencies
        run: npm ci
        working-directory: agro-production/server

      - name: Run root server migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ needs.resolve-env.outputs.environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
        working-directory: server

      - name: Run agro-server migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ needs.resolve-env.outputs.environment == 'production' && secrets.PRODUCTION_AGRO_DATABASE_URL || secrets.STAGING_AGRO_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
        working-directory: agro-production/server

  # ── Smoke tests ────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke tests
    needs: [resolve-env, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set URLs
        id: urls
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "root=https://agrocylo-marketplace.fly.dev"       >> "$GITHUB_OUTPUT"
            echo "agro=https://agrocylo-production.fly.dev"        >> "$GITHUB_OUTPUT"
          else
            echo "root=https://agrocylo-marketplace-staging.fly.dev" >> "$GITHUB_OUTPUT"
            echo "agro=https://agrocylo-production-staging.fly.dev"  >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deploys to stabilize
        run: sleep 30

      - name: Health check — root server
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "${{ steps.urls.outputs.root }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Root server healthy"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying in 10s..."
            sleep 10
          done
          echo "Root server health check failed"
          exit 1

      - name: Health check — agro server
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "${{ steps.urls.outputs.agro }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Agro server healthy"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying in 10s..."
            sleep 10
          done
          echo "Agro server health check failed"
          exit 1

      - name: Health check — root client
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.urls.outputs.root }}/" || true)
          if [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "Root client health check failed (got $code)"
            exit 1
          fi
          echo "Root client healthy ($code)"

      - name: Health check — agro client
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.urls.outputs.agro }}/" || true)
          if [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "Agro client health check failed (got $code)"
            exit 1
          fi
          echo "Agro client healthy ($code)"

  # ── Rollback on failure ────────────────────────────────────────────────────
  rollback:
    name: Rollback
    needs: [resolve-env, smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set app names
        id: apps
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "app_root=agrocylo-marketplace"        >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production"          >> "$GITHUB_OUTPUT"
            echo "app_root_client=agrocylo-client"       >> "$GITHUB_OUTPUT"
            echo "app_agro_client=agrocylo-agro-client"  >> "$GITHUB_OUTPUT"
          else
            echo "app_root=agrocylo-marketplace-staging" >> "$GITHUB_OUTPUT"
            echo "app_agro=agrocylo-production-staging"  >> "$GITHUB_OUTPUT"
            echo "app_root_client=agrocylo-client-staging"  >> "$GITHUB_OUTPUT"
            echo "app_agro_client=agrocylo-agro-client-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Rollback all apps
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for app in \
            "${{ steps.apps.outputs.app_root }}" \
            "${{ steps.apps.outputs.app_root_client }}" \
            "${{ steps.apps.outputs.app_agro }}" \
            "${{ steps.apps.outputs.app_agro_client }}"; do
            echo "Rolling back $app..."
            flyctl releases rollback --app "$app" --yes || true
          done

      - name: Fail the workflow
        run: |
          echo "::error::Deploy failed — all apps rolled back to previous release."
          exit 1
