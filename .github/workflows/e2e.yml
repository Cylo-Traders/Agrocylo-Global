# Playwright end-to-end suite — marketplace (client/).
#
# Trigger scope (Issue #925):
#   Runs on PRs and merge-queue groups that touch the marketplace dependency
#   graph or its launcher: client code, shared frontend packages, and the
#   root workspace manifests/lockfile plus Turbo config it actually consumes.
#   Backend-only (server/**), contract-only (contracts/**, Cargo.*), or
#   agro-production-only changes do NOT trigger this browser suite — they
#   are covered by their own CI jobs (ci.yml).
#   Can also be triggered manually via the GitHub Actions UI or
#   `gh workflow run e2e.yml --ref <branch>`.
#   See also: .github/workflows/ci.yml (path-filter policy) and
#   docs/deployment/README.md (pipeline overview).
#
# Note: agro-production/client uses vitest instead of playwright; its tests run in CI workflow.

name: E2E · Playwright

on:
  pull_request:
    paths:
      - "client/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/e2e.yml"
  merge_group:
    paths:
      - "client/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (${{ github.event.inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # Issue #755: client is now an npm workspace member (root package.json).
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Install Playwright browsers
        run: |
          BROWSER="${{ github.event.inputs.browser || 'chromium' }}"
          if [ "$BROWSER" = "all" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps "$BROWSER"
          fi

      - name: Run Playwright tests
        run: |
          BROWSER="${{ github.event.inputs.browser || 'chromium' }}"
          if [ "$BROWSER" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project="$BROWSER"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.browser }}
          path: client/playwright-report/
          retention-days: 7
