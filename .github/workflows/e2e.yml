# Playwright end-to-end suite.
#
# Runs on PRs that touch root client code. Can also be triggered manually
# via the GitHub Actions UI or `gh workflow run e2e.yml --ref <branch>`.
# Note: agro-production/client uses vitest instead of playwright; its tests run in CI workflow.

name: E2E · Playwright

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (${{ github.event.inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          if [ "$BROWSER" = "all" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps "$BROWSER"
          fi

      - name: Run Playwright tests
        run: |
          if [ "$BROWSER" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project="$BROWSER"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.BROWSER }}
          path: client/playwright-report/
          retention-days: 7
