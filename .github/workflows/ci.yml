name: CI

# Covers Next.js client, Soroban contracts, and Node.js servers.
# All jobs are merge-blocking status checks.

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "contracts/**"
      - "agro-production/client/**"
      - "agro-production/contract/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "contracts/**"
      - "agro-production/client/**"
      - "agro-production/contract/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  client:
    name: Client · Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: node -e "require('fs').writeFileSync('next-env.d.ts','/// <reference types=\"next\" />\n/// <reference types=\"next/image-types/global\" />\n\n// NOTE: This file should not be edited\n// see https://nextjs.org/docs/basic-features/typescript for more information.\n')"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Server · Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

  server-integration:
    name: Server · Prisma schema/migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agrocylo
          POSTGRES_PASSWORD: agrocylo123
          POSTGRES_DB: agrocylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The full `prisma migrate deploy` history predates this repo tracking
      # a from-scratch baseline migration, so a clean CI database can't
      # replay it end-to-end. Apply just the migration under test directly,
      # which is sufficient to prove schema.prisma and the migration agree.
      - name: Apply crop plan / equipment marketplace migration
        run: psql "$DATABASE_URL" -f prisma/migrations/20260731000000_add_crop_plan_equipment_marketplace/migration.sql

      - name: Run integration tests against real Prisma client
        run: npm run test:integration

  contracts:
    name: Contracts · Rust (Soroban)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo tests
        run: cargo test --workspace

      # ---------------------------------------------------------------------------
      # Invariant / property-based test suite (time-boxed)
      #
      # These tests exercise the three most fund-sensitive contracts:
      #   • production_escrow  – fund-conservation, no-double-claim,
      #                          terminal-state-lock, fee-accounting,
      #                          state-machine fuzzer (40 random op sequences × ~25 ops each)
      #   • governance         – vote-weight-conservation, proposal-lifecycle-lock,
      #                          timelock-enforced
      #   • investment_basket  – deposit-conservation, payout-never-exceeds-collected,
      #                          no-overpay-per-depositor
      #
      # Runtime budget (measured on GitHub-hosted ubuntu-latest, 2-core):
      #   production_escrow invariant_tests  ≈ 30–45 s  (proptest cases: 20–30 each)
      #   production_escrow state_machine    ≈ 60–90 s  (proptest cases: 40, 15 ops avg)
      #   governance invariant_tests         ≈ 20–35 s  (proptest cases: 20–30 each)
      #   investment_basket invariant_tests  ≈ 20–30 s  (proptest cases: 15–20 each)
      #   ─────────────────────────────────────────────────────────────────────────
      #   Total (sequential, one test thread per crate)    ≈ 2–3 minutes
      #
      # The step timeout is set to 5 minutes to give 2× headroom against
      # hardware variance while remaining a merge-blocking check.
      # ---------------------------------------------------------------------------
      - name: Run invariant / property-based tests (time-boxed ≤ 5 min)
        timeout-minutes: 5
        env:
          # Limit proptest to its configured case counts; no override needed.
          # PROPTEST_CASES can be lowered here to speed up CI if needed:
          # PROPTEST_CASES: "10"
          RUST_BACKTRACE: "1"
        run: |
          cargo test --workspace \
            invariant_tests \
            state_machine_tests \
            -- --test-threads=4 2>&1 | tail -50

      - name: Build contracts (release)
        run: cargo build --workspace --target wasm32v1-none --release

  agro-production-client:
    name: Agro-Production Client · Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agro-production/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agro-production/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
