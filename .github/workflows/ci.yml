name: CI

# Covers Next.js client, Soroban contracts, and Node.js servers.
# All jobs are merge-blocking status checks.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Determine which paths changed ────────────────────────────────────────────
  # Used by other jobs to skip if their paths haven't changed (Issue #912)
  paths:
    name: Determine changed paths
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.changes.outputs.client }}
      server: ${{ steps.changes.outputs.server }}
      contracts: ${{ steps.changes.outputs.contracts }}
      agro-client: ${{ steps.changes.outputs.agro-client }}
      shared-deps: ${{ steps.changes.outputs.shared-deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            client:
              - 'client/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            agro-client:
              - 'agro-production/client/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            shared-deps:
              - 'client/**'
              - 'agro-production/client/**'
              - 'package.json'
              - 'package-lock.json'
  shared-dependency-versions:
    name: Shared client dependency versions (Issue #755 / #728)
    needs: paths
    if: needs.paths.outputs.shared-deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check client / agro-production/client stay on the same major versions
        run: node scripts/check-shared-versions.js

  client:
    name: Client · Next.js
    needs: paths
    if: needs.paths.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Issue #755: client is now an npm workspace member (root package.json),
      # sharing a single root-level lockfile/node_modules with
      # agro-production/client and packages/*. Install runs once at the repo
      # root; every other step below still runs scoped to client/ via this
      # job's `defaults.run.working-directory`.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # `next lint` was removed in Next.js 16 (Issue #755 discovered this
      # broken on main); switched to `eslint .` directly. That surfaced ~20
      # pre-existing lint errors across the app that were never actually
      # being checked before (the old script crashed before linting a single
      # file). These must be fixed to keep lint quality high.
      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: |
          node -e "require('fs').writeFileSync('next-env.d.ts','/// <reference types=\"next\" />\n/// <reference types=\"next/image-types/global\" />\n\n// NOTE: This file should not be edited\n// see https://nextjs.org/docs/basic-features/typescript for more information.\n')"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Server · Node.js
    needs: paths
    if: needs.paths.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # prisma.config.ts requires DATABASE_URL to be set for any Prisma
      # command, including `generate`, which otherwise doesn't need a
      # reachable database — this job has no postgres service, so the value
      # only needs to be well-formed, not connectable.
      DATABASE_URL: postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

  server-integration:
    name: Server · Prisma schema/migration integration
    needs: paths
    if: needs.paths.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agrocylo
          POSTGRES_PASSWORD: agrocylo123
          POSTGRES_DB: agrocylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply full migration history
        run: npx prisma migrate deploy

      - name: Verify schema.prisma matches migration history (no drift)
        run: npx prisma migrate diff --from-config-datasource prisma/schema.prisma --to-schema prisma/schema.prisma --exit-code

      - name: Run integration tests against real Prisma client
        run: npm run test:integration

  contracts:
    name: Contracts · Rust (Soroban)
    needs: paths
    if: needs.paths.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fast cargo check
        run: cargo check --workspace --all-targets --target wasm32v1-none

      - name: Build tests (no-run)
        run: cargo test --workspace --no-run

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo tests
        run: cargo test --workspace

      # ---------------------------------------------------------------------------
      # Invariant / property-based test suite (time-boxed)
      #
      # These tests exercise the three most fund-sensitive contracts:
      #   • production_escrow  – fund-conservation, no-double-claim,
      #                          terminal-state-lock, fee-accounting,
      #                          state-machine fuzzer (40 random op sequences × ~25 ops each)
      #   • governance         – vote-weight-conservation, proposal-lifecycle-lock,
      #                          timelock-enforced
      #   • investment_basket  – deposit-conservation, payout-never-exceeds-collected,
      #                          no-overpay-per-depositor
      #
      # Runtime budget (measured on GitHub-hosted ubuntu-latest, 2-core):
      #   production_escrow invariant_tests  ≈ 30–45 s  (proptest cases: 20–30 each)
      #   production_escrow state_machine    ≈ 60–90 s  (proptest cases: 40, 15 ops avg)
      #   governance invariant_tests         ≈ 20–35 s  (proptest cases: 20–30 each)
      #   investment_basket invariant_tests  ≈ 20–30 s  (proptest cases: 15–20 each)
      #   ─────────────────────────────────────────────────────────────────────────
      #   Total (sequential, one test thread per crate)    ≈ 2–3 minutes
      #
      # The step timeout is set to 5 minutes to give 2× headroom against
      # hardware variance while remaining a merge-blocking check.
      # ---------------------------------------------------------------------------
      - name: Run invariant / property-based tests (time-boxed ≤ 5 min)
        timeout-minutes: 5
        env:
          # Limit proptest to its configured case counts; no override needed.
          # PROPTEST_CASES can be lowered here to speed up CI if needed:
          # PROPTEST_CASES: "10"
          RUST_BACKTRACE: "1"
        run: |
          set -e -o pipefail
          cargo test --workspace invariant_tests -- --test-threads=4
          cargo test --workspace state_machine_tests -- --test-threads=4

      - name: Build contracts (release)
        run: cargo build --workspace --target wasm32v1-none --release

  agro-production-client:
    name: Agro-Production Client · Next.js
    needs: paths
    if: needs.paths.outputs.agro-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agro-production/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Issue #755: same root-workspace install as the client job above.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: No committed build artifacts under src/
        run: |
          matches=$(git ls-files 'src/**/*.js' 'src/**/*.js.map' 'src/**/*.d.ts' 'src/**/*.d.ts.map')
          if [ -n "$matches" ]; then
            echo "Generated build artifacts must not be committed under src/:"
            echo "$matches"
            exit 1
          fi

      # Migrated .eslintrc.json -> flat config alongside the eslint-config-next
      # 16 bump (Issue #755). That surfaced ~66 pre-existing lint errors that
      # were never actually checked before under the old config. These must be
      # fixed to keep lint quality high.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
