name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'agro-production/server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agro-production/server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    name: Install and Build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: agro-production/server

      - name: Generate Prisma types
        run: npx prisma generate
        working-directory: agro-production/server

      - name: Build TypeScript
        run: npm run build
        working-directory: agro-production/server

      - name: Run linter
        run: npm run lint
        working-directory: agro-production/server

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: install-and-build
    # Issue #1064: the suite now releases its resources in afterAll, so a run
    # that outlives this budget means a handle leaked again. Fail fast instead
    # of burning the 6-hour GitHub default.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agrocylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: agro-production/server

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/agrocylo_test
        run: npx prisma migrate deploy
        working-directory: agro-production/server

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/agrocylo_test
        # Leaked handles abort the run with a diagnostic naming the owning test
        # file instead of hanging until the job timeout.
        timeout-minutes: 8
        run: npm test
        working-directory: agro-production/server

  security:
    runs-on: ubuntu-latest
    name: Security Audit
    needs: install-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: agro-production/server

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: agro-production/server

  secret-scanning:
    runs-on: ubuntu-latest
    name: Secret Scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./agro-production/server
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
