name: Compose CI

# Validates that docker compose builds and starts successfully.
# Runs on PRs touching compose / Dockerfile paths, and daily as a
# scheduled job to catch silent rot.

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "Caddyfile"
      - ".env"
      - "server/Dockerfile"
      - "client/Dockerfile"
      - "agro-production/server/Dockerfile"
      - "agro-production/client/Dockerfile"
      - ".github/workflows/compose-ci.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-build:
    name: Compose build & start
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_db
          AGRO_DATABASE_URL=postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_production
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          JWT_SECRET=b873d25323eb8673ad2d4ef5a86f7181ddb5f3cae3ed14c5fd8573c5b1d5f5e8
          ENVEOF
          fi

      - name: Build all services
        run: docker compose build --no-cache

      - name: Start all services
        run: docker compose up -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for the named services..."
          timeout 180 bash -c 'until docker compose ps --all --format json | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          rows = json.loads(raw) if raw.startswith(\"[\") else [json.loads(l) for l in raw.splitlines() if l.strip()]
          state = {r[\"Service\"]: r for r in rows}
          need_healthy = [\"postgres\", \"postgres-agro\", \"redis\"]
          need_running = [\"backend\", \"agro-backend\", \"client\", \"agro-client\", \"caddy\"]
          bad = [s for s in need_healthy if state.get(s, {}).get(\"Health\") != \"healthy\"]
          bad += [s for s in need_running if state.get(s, {}).get(\"State\") != \"running\"]
          print(\"waiting on:\", bad or \"nothing\")
          sys.exit(1 if bad else 0)
          "; do sleep 5; done'

      - name: Verify API endpoints respond
        run: |
          echo "--- Root backend health ---"
          curl -fsS --max-time 10 http://localhost:5000/health
          echo ""
          echo "--- Agro backend health ---"
          curl -fsS --max-time 10 http://localhost:5001/health
          echo ""

      - name: Verify client apps respond
        run: |
          for url in http://localhost:3000/ http://localhost:3001/; do
            code=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url returned $code"; exit 1; }
          done

      - name: Verify Caddy proxy routes
        run: |
          echo "--- Proxy: root client ---"
          code=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" http://localhost/)
          echo "/ -> $code"
          [ "$code" = "200" ] || { echo "::error::proxy / returned $code"; exit 1; }
          echo "--- Proxy: root API ---"
          curl -fsS --max-time 10 http://localhost/api/health
          echo ""
          # These two routes may answer 404 for the bare path, but a stopped
          # upstream or a missing route gives 000 or 5xx, which must fail.
          for path in /agro/ /api/v1/; do
            code=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost$path")
            echo "$path -> $code"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "::error::proxy $path returned $code"
              exit 1
            fi
          done

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
