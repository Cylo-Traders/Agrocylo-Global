name: Compose CI

# Validates that docker compose builds and starts successfully.
# Runs on PRs touching compose / Dockerfile paths, and daily as a
# scheduled job to catch silent rot.

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "Caddyfile"
      - ".env"
      - "server/Dockerfile"
      - "client/Dockerfile"
      - "agro-production/server/Dockerfile"
      - "agro-production/client/Dockerfile"
      - ".github/workflows/compose-ci.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-build:
    name: Compose build & start
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_db
          AGRO_DATABASE_URL=postgresql://agrocylo:agrocylo123@localhost:5432/agrocylo_production
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          JWT_SECRET=b873d25323eb8673ad2d4ef5a86f7181ddb5f3cae3ed14c5fd8573c5b1d5f5e8
          ENVEOF
          fi

      - name: Build all services
        run: docker compose build --no-cache

      - name: Start all services
        run: docker compose up -d

      - name: Wait for required services to become healthy
        run: |
          set -euo pipefail
          echo "Waiting for required services to become healthy..."
          timeout 180 bash -c 'until docker compose ps --format json | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          if not raw:
              sys.exit(1)
          services = json.loads(raw) if raw.startswith(\"[\") else [json.loads(line) for line in raw.splitlines() if line.strip()]
          by_service = {s.get(\"Service\") or s.get(\"Name\", \"\"): s for s in services}

          required_healthy = [\"postgres\", \"postgres-agro\", \"redis\", \"backend\", \"agro-backend\", \"client\", \"agro-client\"]
          required_running = [\"caddy\"]

          missing_or_unhealthy = []
          for name in required_healthy:
              svc = by_service.get(name)
              health = (svc or {}).get(\"Health\", \"\")
              if health != \"healthy\":
                  missing_or_unhealthy.append(f\"{name}={health or '\''missing'\''}\")

          for name in required_running:
              svc = by_service.get(name)
              state = (svc or {}).get(\"State\", \"\")
              if state != \"running\":
                  missing_or_unhealthy.append(f\"{name}={state or '\''missing'\''}\")

          if missing_or_unhealthy:
              print(\"Pending services:\", \", \".join(missing_or_unhealthy))
              sys.exit(1)

          print(\"All required services are healthy and running.\")
          sys.exit(0)
          "; do sleep 5; done'

      - name: Verify API endpoints respond
        run: |
          set -euo pipefail
          echo "--- Root backend health ---"
          root_health="$(curl -fsS --max-time 10 http://localhost:5000/health)"
          echo "$root_health"
          grep -qE '"status"\s*:\s*"(ok|UP|healthy)"' <<<"$root_health"

          echo "--- Agro backend health ---"
          agro_health="$(curl -fsS --max-time 10 http://localhost:5001/health)"
          echo "$agro_health"
          grep -qE '"status"\s*:\s*"(UP|ok|healthy)"' <<<"$agro_health"

      - name: Verify client apps respond
        run: |
          set -euo pipefail
          echo "--- Root client ---"
          root_code="$(curl -fsS --max-time 10 -o /dev/null -w "%{http_code}" http://localhost:3000/)"
          echo "HTTP $root_code"
          test "$root_code" = "200"

          echo "--- Agro client ---"
          agro_code="$(curl -fsS --max-time 10 -L -o /dev/null -w "%{http_code}" http://localhost:3001/)"
          echo "HTTP $agro_code"
          test "$agro_code" = "200"

      - name: Verify Caddy proxy routes
        run: |
          set -euo pipefail
          echo "--- Proxy: root client ---"
          proxy_root_code="$(curl -fsS --max-time 10 -o /dev/null -w "%{http_code}" http://localhost/)"
          echo "HTTP $proxy_root_code"
          test "$proxy_root_code" = "200"

          echo "--- Proxy: root API ---"
          proxy_api="$(curl -fsS --max-time 10 http://localhost/api/health)"
          echo "$proxy_api"
          grep -qE '"status"\s*:\s*"(ok|UP|healthy)"' <<<"$proxy_api"

          echo "--- Proxy: agro client ---"
          proxy_agro_code="$(curl -fsS --max-time 10 -L -o /dev/null -w "%{http_code}" http://localhost/agro/)"
          echo "HTTP $proxy_agro_code"
          test "$proxy_agro_code" = "200"

          echo "--- Proxy: agro API ---"
          proxy_agro_api="$(curl -fsS --max-time 10 http://localhost/api/v1/campaigns)"
          echo "$proxy_agro_api"

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
