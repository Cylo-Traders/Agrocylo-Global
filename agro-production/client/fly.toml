# fly.toml — Agro-production client (Next.js)
# Fly.io app: agrocylo-agro-client (prod) / agrocylo-agro-client-staging (staging)

app = "agrocylo-agro-client"
primary = "iad"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Issue #1038: the production feature gate. A production build is served only
# when this is exactly the string "true"; any other value renders the
# "This build is not available" page. Declared here so the intended value is
# explicit in deployment configuration rather than implied by absence.
#
# Flip to "true" in the production app once the deployment is ready to serve
# the app to users.
[env]
  NEXT_PUBLIC_AGRO_PRODUCTION_ENABLED = "false"
