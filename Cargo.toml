[workspace]
resolver = "2"
exclude = ["archive/weather-insurance"]
members = [
    "contracts/escrow",
    "contracts/registry",
    "contracts/production_escrow",
    "contracts/investment_basket",
    "contracts/governance",
]


# ── Pinned workspace-wide dependencies (see docs/TOOLCHAIN.md) ──────────────
[workspace.dependencies]
soroban-sdk = { version = "22.0.11" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "debuginfo"
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug = true
